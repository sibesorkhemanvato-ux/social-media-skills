name: انتشار اپ مدیر ساختمان روی GitHub Pages

on:
  push:
    branches: [arena/01a0e3de-social-media-skills, main]
    paths:
      - 'building-manager/**'
      - '.github/workflows/deploy-building-manager.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: building-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # These are public endpoint identifiers, never the Bale bot token.
          VITE_BALE_BRIDGE_URL: ${{ vars.BALE_BRIDGE_URL }}
          VITE_BALE_BOT_USERNAME: ${{ vars.BALE_BOT_USERNAME }}
      - run: npm ci --prefix bale-worker
      - run: npm test --prefix bale-worker
      - run: npm run check --prefix bale-worker
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: building-manager/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
